dispatch.latest_time = now
enableSched = 1
schedule_window = 0
disabled = 0
search = | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime sum(All_Traffic.bytes_out) as bytes_out values(All_Traffic.dest_port) as dest_port values(All_Traffic.app) as app from datamodel=Network_Traffic.All_Traffic where index=esdemo All_Traffic.action=allowed by All_Traffic.src All_Traffic.dest \
| `drop_dm_object_name("All_Traffic")` \
| where NOT (cidrmatch("10.0.0.0/8", dest) OR cidrmatch("172.16.0.0/12", dest) OR cidrmatch("192.168.0.0/16", dest)) AND bytes_out > 524288000 \
| lookup esdemo_assets ip AS src OUTPUT nt_host AS src_host \
| eval src_host=coalesce(src_host, src), mb_out=round(bytes_out/1048576, 1)

