# Lookup definitions for ES Asset and Identity Management.
# In ES: Configure > Asset and identity management > add a new asset source
# pointing to esdemo_assets, and a new identity source pointing to esdemo_identities.

[esdemo_assets]
filename = esdemo_assets.csv
case_sensitive_match = false

[esdemo_identities]
filename = esdemo_identities.csv
case_sensitive_match = false
