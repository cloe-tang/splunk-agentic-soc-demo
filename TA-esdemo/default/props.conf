# All demo sourcetypes arrive through the HEC /services/collector/event endpoint as
# JSON with CIM-native field names, so the add-on only needs JSON extraction,
# a few EVALs and the CIM tags (eventtypes.conf / tags.conf).
#
# Index-time settings below take effect only for the /raw endpoint; with /event the
# event time comes from the HEC "time" field. They are kept for safety.

[esdemo:auth]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor_product = coalesce(vendor_product, "Kestrel IdP")
EVAL-signature = coalesce(signature, if(action=="success", "User logged on", "User failed to log on"))
FIELDALIAS-src_ip = src AS src_ip

[esdemo:endpoint:process]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor_product = coalesce(vendor_product, "Kestrel EDR")
EVAL-action = coalesce(action, "allowed")
EVAL-process_exec = coalesce(process_exec, process_name)
EVAL-user_id = coalesce(user_id, user)

[esdemo:email]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor_product = coalesce(vendor_product, "Kestrel Mail Gateway")
EVAL-src_user_domain = mvindex(split(src_user, "@"), 1)
EVAL-recipient_domain = mvindex(split(recipient, "@"), 1)

[esdemo:proxy]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor_product = coalesce(vendor_product, "Kestrel Web Proxy")
EVAL-bytes = coalesce(bytes, bytes_in + bytes_out)
EVAL-url_length = len(url)

[esdemo:firewall]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor_product = coalesce(vendor_product, "Kestrel Firewall")
EVAL-bytes = coalesce(bytes, bytes_in + bytes_out)
FIELDALIAS-src_ip = src AS src_ip
FIELDALIAS-dest_ip = dest AS dest_ip

[esdemo:change]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor_product = coalesce(vendor_product, "Microsoft Active Directory")
EVAL-change_type = coalesce(change_type, "AAA")
EVAL-object_category = coalesce(object_category, "user")
EVAL-status = coalesce(status, "success")
EVAL-result = coalesce(result, "success")

# Deliberately NOT mapped to a data model. This is the "detection gap" for the
# Detection Builder Agent demo: raw Exchange Online audit events (New-InboxRule /
# Set-InboxRule with external forwarding) that no detection covers yet.
[esdemo:o365:audit]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "CreationTime"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-user = mvindex(split(UserId, "@"), 0)
FIELDALIAS-src = ClientIP AS src
